services:
  api-gateway:
    image: sanos-api-gateway:latest
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - user-service
      - pet-service
      - report-service
      - match-service
      - notification-service
    networks:
      - sanos-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  auth-service:
    image: sanos-auth-service:latest
    ports:
      - "8081:8081"
    networks:
      - sanos-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  user-service:
    image: sanos-user-service:latest
    ports:
      - "8082:8082"
    networks:
      - sanos-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  pet-service:
    image: sanos-pet-service:latest
    ports:
      - "8083:8083"
    networks:
      - sanos-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  report-service:
    image: sanos-report-service:latest
    ports:
      - "8084:8084"
    networks:
      - sanos-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  match-service:
    image: sanos-match-service:latest
    ports:
      - "8085:8085"
    networks:
      - sanos-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  notification-service:
    image: sanos-notification-service:latest
    ports:
      - "8086:8086"
    networks:
      - sanos-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  sanos-network:
    driver: overlay
    attachable: true
