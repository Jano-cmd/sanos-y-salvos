services:
  api-gateway:
    build: ./api-gateway
    image: sanos-api-gateway:latest
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - user-service
      - pet-service
      - report-service
      - match-service
      - notification-service
    networks:
      - sanos-network

  auth-service:
    build: ./auth-service
    image: sanos-auth-service:latest
    ports:
      - "8081:8081"
    networks:
      - sanos-network

  user-service:
    build: ./user-service
    image: sanos-user-service:latest
    ports:
      - "8082:8082"
    networks:
      - sanos-network

  pet-service:
    build: ./pet-service
    image: sanos-pet-service:latest
    ports:
      - "8083:8083"
    networks:
      - sanos-network

  report-service:
    build: ./report-service
    image: sanos-report-service:latest
    ports:
      - "8084:8084"
    networks:
      - sanos-network

  match-service:
    build: ./match-service
    image: sanos-match-service:latest
    ports:
      - "8085:8085"
    networks:
      - sanos-network

  notification-service:
    build: ./notification-service
    image: sanos-notification-service:latest
    ports:
      - "8086:8086"
    networks:
      - sanos-network

networks:
  sanos-network:
    driver: bridge
