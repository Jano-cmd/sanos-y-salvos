name: AWS EC2 Deploy

on:
  push:
    branches:
      - implementacion-aws
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-ec2-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Test and Build - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - pet-service
          - report-service
          - match-service
          - notification-service

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B clean package

  deploy-to-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test-and-build
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key and known_hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          test -n "$EC2_HOST" || { echo "EC2_HOST secret is not configured"; exit 1; }
          test -n "$EC2_USER" || { echo "EC2_USER secret is not configured"; exit 1; }
          test -n "$EC2_SSH_KEY" || { echo "EC2_SSH_KEY secret is not configured"; exit 1; }

          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$EC2_SSH_KEY" > "$RUNNER_TEMP/ec2_deploy_key"
          chmod 600 "$RUNNER_TEMP/ec2_deploy_key"
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy application on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail

          ssh -i "$RUNNER_TEMP/ec2_deploy_key" "$EC2_USER@$EC2_HOST" 'bash -seuo pipefail' <<'EOF'
          cd /home/ubuntu/sanos-y-salvos

          git fetch origin
          git checkout implementacion-aws
          git reset --hard origin/implementacion-aws

          if [ ! -f .env.ec2 ]; then
            echo ".env.ec2 was not found in /home/ubuntu/sanos-y-salvos. Deployment aborted."
            exit 1
          fi

          command -v docker >/dev/null 2>&1 || { echo "Docker is not installed or not available in PATH"; exit 1; }
          docker info >/dev/null 2>&1 || { echo "Docker daemon is not responding"; exit 1; }
          docker compose version >/dev/null 2>&1 || { echo "Docker Compose is not available"; exit 1; }
          command -v curl >/dev/null 2>&1 || { echo "curl is required for health checks"; exit 1; }

          docker compose --env-file .env.ec2 -f docker-compose.ec2.yml build api-gateway
          docker compose --env-file .env.ec2 -f docker-compose.ec2.yml build auth-service
          docker compose --env-file .env.ec2 -f docker-compose.ec2.yml build user-service
          docker compose --env-file .env.ec2 -f docker-compose.ec2.yml build pet-service
          docker compose --env-file .env.ec2 -f docker-compose.ec2.yml build report-service
          docker compose --env-file .env.ec2 -f docker-compose.ec2.yml build match-service
          docker compose --env-file .env.ec2 -f docker-compose.ec2.yml build notification-service

          show_service_diagnostics() {
            service_name="$1"
            container_id="$(docker compose --env-file .env.ec2 -f docker-compose.ec2.yml ps -q "$service_name")"

            docker compose --env-file .env.ec2 -f docker-compose.ec2.yml ps

            if [ -n "$container_id" ]; then
              docker inspect --format '{{json .State.Health}}' "$container_id" || true
            else
              echo "No container found for $service_name"
            fi

            docker compose --env-file .env.ec2 -f docker-compose.ec2.yml logs --tail=200 "$service_name" || true
          }

          wait_for_health() {
            service_name="$1"
            port="$2"
            attempts="$3"
            url="http://localhost:${port}/actuator/health"
            sleep_seconds=15
            attempt=1

            while [ "$attempt" -le "$attempts" ]; do
              response="$(curl -fsS "$url" || true)"
              if printf '%s' "$response" | grep -q '"status"[[:space:]]*:[[:space:]]*"UP"'; then
                echo "$service_name is healthy"
                return 0
              fi

              echo "[$service_name] Health check attempt $attempt/$attempts on port $port"
              sleep "$sleep_seconds"
              attempt=$((attempt + 1))
            done

            echo "$service_name failed health checks at $url"
            show_service_diagnostics "$service_name"
            return 1
          }

          if ! docker compose --env-file .env.ec2 -f docker-compose.ec2.yml up -d; then
            echo "docker compose up -d returned a non-zero exit code. Waiting for backend services before retrying api-gateway."
            docker compose --env-file .env.ec2 -f docker-compose.ec2.yml ps
          fi

          wait_for_health auth-service 8081 20
          wait_for_health user-service 8082 20
          wait_for_health pet-service 8083 20
          wait_for_health report-service 8084 20
          wait_for_health match-service 8085 20
          wait_for_health notification-service 8086 20

          docker compose --env-file .env.ec2 -f docker-compose.ec2.yml up -d api-gateway

          wait_for_health api-gateway 8080 20

          echo "Deployment completed successfully"
          echo "All 7 services are healthy"
          EOF

      - name: Remove temporary SSH key
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/ec2_deploy_key"
